# Deploys download-page/ to Firebase Hosting (ettuning.net/client-download).
# Signs in to Google Cloud with Workload Identity Federation, so no key is stored.
# One-time setup is download-page/setup-gcloud.sh. Until the FIREBASE_PROJECT_ID
# repository variable is set, the job is skipped.
name: Deploy download page

on:
  push:
    branches: [master]
    paths:
      - "download-page/**"
      - ".github/workflows/deploy-download-page.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-download-page
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.FIREBASE_PROJECT_ID != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      - name: Deploy
        working-directory: download-page
        run: npx --yes firebase-tools@15 deploy --only hosting --project "${{ vars.FIREBASE_PROJECT_ID }}" --non-interactive
