name: ET Tuning Windows build

# Builds ET Tuning Remote Client for Windows x64.
#
# - Pull requests and manual runs: build and run the Rust tests, and keep the
#   installers as workflow artifacts.
# - A tag like v1.5.2 (matching the version in Cargo.toml), or a manual run with
#   "release" checked: also publish a GitHub Release, tagged v<Cargo.toml version>,
#   with the installers and the signed update metadata. Installed clients find new
#   versions through that release.
#
# Secrets (Settings > Secrets and variables > Actions):
# - UPDATE_ED25519_SEED (required for tag releases): signs the update metadata.
#   Its public key is compiled into src/update_metadata.rs.
# - WINDOWS_CERT_PFX_BASE64 and WINDOWS_CERT_PASSWORD (optional): Authenticode
#   code-signing certificate. Without them the installers are unsigned and
#   Windows SmartScreen will warn on first run.

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release tagged v<Cargo.toml version> from this commit"
        type: boolean
        default: false
  pull_request:
    paths-ignore:
      - "docs/**"
      - "README.md"
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

env:
  RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  # Keep in sync with flutter-build.yml when merging upstream.
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  APP_NAME: "ETTuningRemote"
  MANUFACTURER: "East Texas Tuning"
  IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-topmost-window:
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    with:
      upload-artifact: true
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10

  build-windows:
    name: Windows x64
    needs: [generate-bridge, build-topmost-window]
    runs-on: windows-2022
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Read version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if [ "$IS_TAG" = "true" ] && [ "${GITHUB_REF_NAME}" != "v$VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml version $VERSION"
            exit 1
          fi

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      # https://github.com/flutter/flutter/issues/155685
      - name: Replace engine with rustdesk custom flutter engine
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: windows-2022

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        shell: bash
        run: |
          if ! $VCPKG_ROOT/vcpkg install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"; echo "======"; cat "$_1"; echo "======"; echo ""
            done
            exit 1
          fi

      - name: Build
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk
          # The app installs and runs as <APP_NAME>.exe.
          mv ./rustdesk/rustdesk.exe ./rustdesk/${{ env.APP_NAME }}.exe

          # Virtual display driver, as in upstream builds.
          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath .
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
          mv -Force .\usbmmidd_v2 ./rustdesk

      # The X: drive (src/xdrive.rs) runs rclone, which needs the WinFsp driver.
      - name: Bundle rclone and WinFsp
        shell: pwsh
        env:
          RCLONE_VERSION: "v1.69.1"
          WINFSP_URL: "https://github.com/winfsp/winfsp/releases/download/v2.0/winfsp-2.0.23075.msi"
        run: |
          New-Item -ItemType Directory -Force -Path ./rustdesk/xdrive | Out-Null
          $zip = "rclone-$env:RCLONE_VERSION-windows-amd64.zip"
          Invoke-WebRequest -Uri "https://downloads.rclone.org/$env:RCLONE_VERSION/$zip" -OutFile $zip
          Invoke-WebRequest -Uri "https://downloads.rclone.org/$env:RCLONE_VERSION/SHA256SUMS" -OutFile rclone-sums.txt
          $expected = (Select-String -Path rclone-sums.txt -Pattern "^([0-9a-f]{64})\s+$([regex]::Escape($zip))$").Matches[0].Groups[1].Value
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if (-not $expected -or $expected -ne $actual) { throw "rclone checksum mismatch: '$expected' vs '$actual'" }
          Expand-Archive $zip -DestinationPath rclone-unzip
          Copy-Item rclone-unzip/*/rclone.exe ./rustdesk/xdrive/rclone.exe
          Invoke-WebRequest -Uri $env:WINFSP_URL -OutFile ./rustdesk/xdrive/winfsp.msi
          $sig = Get-AuthenticodeSignature ./rustdesk/xdrive/winfsp.msi
          if ($sig.Status -ne "Valid" -or $sig.SignerCertificate.Subject -notmatch "Navimatics") {
            throw "WinFsp MSI signature: $($sig.Status) $($sig.SignerCertificate.Subject)"
          }

      # USB over IP (src/usbip.rs): usbipd-win shares a device on the customer's PC,
      # usbip-win2 attaches it on the technician's. Both are installed on first use.
      - name: Bundle USB/IP installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ./rustdesk/usbip | Out-Null
          $files = @(
            @{ Url = "https://github.com/dorssel/usbipd-win/releases/download/v5.3.0/usbipd-win_5.3.0_x64.msi"; Out = "usbipd-win.msi"; Sha = "1c984914aec944de19b64eff232421439629699f8138e3ddc29301175bc6d938" },
            @{ Url = "https://github.com/vadimgrn/usbip-win2/releases/download/v.0.9.8.0/USBip-0.9.8.0-x64.exe"; Out = "usbip-win2-setup.exe"; Sha = "81f426741f7ee2ed991febe24a22daca8400b6ae2f171054e3fb404897e15d39" }
          )
          foreach ($f in $files) {
            $path = "./rustdesk/usbip/$($f.Out)"
            Invoke-WebRequest -Uri $f.Url -OutFile $path
            $actual = (Get-FileHash $path -Algorithm SHA256).Hash.ToLower()
            if ($actual -ne $f.Sha) { throw "$($f.Out) checksum mismatch: $actual" }
          }

      - name: Run the Rust tests
        shell: bash
        run: |
          FEATURES=$(python3 ./build.py --portable --flutter --skip-portable-pack --hwcodec --vram --print-features)
          cargo test --locked --release --lib --features "$FEATURES"

      - name: Download topmost window helper
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: topmostwindow-artifacts-x64
          path: "./rustdesk"

      - name: Import code-signing certificate
        id: cert
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
        run: |
          if (-not $env:PFX_BASE64) { "enabled=false" >> $env:GITHUB_OUTPUT; exit 0 }
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", [Convert]::FromBase64String($env:PFX_BASE64))
          "enabled=true" >> $env:GITHUB_OUTPUT

      - name: Sign app files
        if: steps.cert.outputs.enabled == 'true'
        shell: pwsh
        env:
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          Get-ChildItem ./rustdesk -Recurse -Include *.exe,*.dll | ForEach-Object {
            & $signtool.FullName sign /f "$env:RUNNER_TEMP\cert.pfx" /p $env:CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "signing failed: $($_.FullName)" }
          }

      - name: Build self-extracting exe
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e ../../rustdesk/${APP_NAME}.exe
          popd
          mkdir -p ./SignOutput
          mv ./target/release/rustdesk-portable-packer.exe ./SignOutput/${APP_NAME}-${VERSION}-x86_64.exe

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

      - name: Build msi
        run: |
          pushd ./res/msi
          New-Item -ItemType Directory -Force -Path Package/Resources | Out-Null
          Copy-Item ../et-tuning/WixUIBannerBmp.bmp, ../et-tuning/WixUIDialogBmp.bmp Package/Resources/
          python preprocess.py --arp -d ../../rustdesk --app-name "${{ env.APP_NAME }}" -m "${{ env.MANUFACTURER }}"
          nuget restore msi.sln
          msbuild msi.sln -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10
          $msi = Get-ChildItem ./Package/bin/*/Release/en-us/Package.msi | Select-Object -First 1
          mv $msi.FullName ../../SignOutput/${{ env.APP_NAME }}-${{ env.VERSION }}-x86_64.msi
          popd

      - name: Sign installers
        if: steps.cert.outputs.enabled == 'true'
        shell: pwsh
        env:
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          Get-ChildItem ./SignOutput -Include *.exe,*.msi -Recurse | ForEach-Object {
            & $signtool.FullName sign /f "$env:RUNNER_TEMP\cert.pfx" /p $env:CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "signing failed: $($_.FullName)" }
          }

      - name: Upload installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-installers
          path: ./SignOutput/*
          if-no-files-found: error

  publish-release:
    needs: [build-windows]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release
    runs-on: ubuntu-22.04
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Pick release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG_NAME already exists; bump the version in Cargo.toml first."
            exit 1
          fi
          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_ENV"

      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: 'python -m pip install --only-binary=:all: --require-hashes -r res/update/update_metadata_requirements.txt'

      - name: Download installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-installers
          path: ./artifacts/

      - name: Sign update metadata
        env:
          RUSTDESK_UPDATE_ED25519_SEED: ${{ secrets.UPDATE_ED25519_SEED }}
        run: |
          VERSION="${TAG_NAME#v}"
          python res/update/generate_update_metadata.py sign \
            --artifact windows x86_64 exe "./artifacts/${APP_NAME}-${VERSION}-x86_64.exe" \
            --artifact windows x86_64 msi "./artifacts/${APP_NAME}-${VERSION}-x86_64.msi" \
            --version "$VERSION" --release-id "$TAG_NAME" \
            --package-id rustdesk \
            --release-base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download" \
            --published-at "$(git log -1 --format=%cI)" \
            --metadata-out ./rustdesk-update.json \
            --signature-out ./rustdesk-update.json.sig

      - name: Verify update metadata against the key compiled into the app
        env:
          RUSTDESK_UPDATE_ED25519_SEED: ${{ secrets.UPDATE_ED25519_SEED }}
        run: |
          VERSION="${TAG_NAME#v}"
          export RUSTDESK_UPDATE_ED25519_PUBLIC_KEY=$(python - <<'EOF'
          import base64, re
          src = open("src/update_metadata.rs").read()
          key = re.search(r"public_key:\s*\[([^\]]+)\]", src).group(1)
          print(base64.b64encode(bytes(int(x) for x in key.split(",") if x.strip())).decode())
          EOF
          )
          python res/update/generate_update_metadata.py check-key
          python res/update/generate_update_metadata.py verify \
            --metadata ./rustdesk-update.json \
            --signature ./rustdesk-update.json.sig \
            --artifact "./artifacts/${APP_NAME}-${VERSION}-x86_64.exe" \
            --artifact "./artifacts/${APP_NAME}-${VERSION}-x86_64.msi" \
            --version "$VERSION" --release-id "$TAG_NAME" \
            --package-id rustdesk \
            --release-base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download"

      # Installed clients look at the latest non-prerelease release, so it is
      # published as a draft first and only made public once every file is there.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
            --title "ET Tuning Remote Client ${TAG_NAME}" --generate-notes \
            ./artifacts/* ./rustdesk-update.json.sig ./rustdesk-update.json
          gh release edit "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
