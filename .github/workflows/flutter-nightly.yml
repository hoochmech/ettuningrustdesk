name: Flutter Nightly Build

on:
  schedule:
    # schedule build every night
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  run-flutter-nightly-build:
    # East Texas Tuning fork: upstream-only; et-tuning-windows.yml builds this fork.
    if: github.repository == 'rustdesk/rustdesk'
    # The reusable build asks for contents: write; without granting it here the
    # run fails at startup on repos whose default token is read-only.
    permissions:
      contents: write
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "nightly"
