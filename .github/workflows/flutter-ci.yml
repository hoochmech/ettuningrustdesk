name: Full Flutter CI

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
    - "docs/**"
    - "README.md"
  push:
    branches:
      - master
    paths-ignore:
      - ".github/**"
      - "docs/**"
      - "README.md"
      - "res/**"
      - "appimage/**"
      - "flatpak/**"

jobs:
  run-ci:
    # East Texas Tuning fork: upstream-only; et-tuning-windows.yml builds this fork.
    if: github.repository == 'rustdesk/rustdesk'
    uses: ./.github/workflows/flutter-build.yml
    with:
      upload-artifact: false
